; Desktop helpers for QwenPaw on Railway (started in the background by
; railway-entrypoint.sh; the QwenPaw app itself runs in the foreground).
;
; Same programs as upstream's deploy/config/supervisord.conf.template
; (Apache-2.0, agentscope-ai/QwenPaw v2.2.2): the system D-Bus, a virtual X
; display :1 and an Xfce session on it. The agent uses them for headed
; Chromium and desktop screenshots. Changes: no [program:app] (the app is
; the container's main process), supervisord's own events go to stdout,
; helper logs are size-capped files, Xvfb never listens on TCP.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/run/railway-supervisord.pid
childlogdir=/var/log/qwenpaw-desktop

[program:dbus]
command=/bin/sh -c "rm -f /run/dbus/pid; mkdir -p /run/dbus; exec /usr/bin/dbus-daemon --system --nofork"
priority=5
autostart=true
autorestart=true
stdout_logfile=/var/log/qwenpaw-desktop/dbus.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

[program:xvfb]
command=/bin/sh -c "rm -f /tmp/.X1-lock /tmp/.X11-unix/X1; mkdir -p /tmp/.X11-unix; exec /usr/bin/Xvfb :1 -screen 0 1280x800x24 -nolisten tcp"
priority=10
autostart=true
autorestart=true
environment=DISPLAY=":1"
stdout_logfile=/var/log/qwenpaw-desktop/xvfb.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

[program:xfce4]
command=/bin/sh -c "for i in $(seq 1 200); do [ -S /tmp/.X11-unix/X1 ] && break; sleep 0.1; done; exec dbus-run-session startxfce4"
priority=20
autostart=true
autorestart=true
environment=DISPLAY=":1"
stdout_logfile=/var/log/qwenpaw-desktop/xfce4.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
